# SPDX-License-Identifier: Apache-2.0
# OpenSSF Scorecard — security best-practices scoring for the lm-chat repo.
# Runs weekly on Monday + on every push to main.
# Results publish to GitHub's security tab (SARIF upload).
# Reference: https://github.com/ossf/scorecard-action
name: OpenSSF Scorecard

on:
  schedule:
    # Weekly on Monday at 06:15 UTC.
    - cron: "15 6 * * 1"
  push:
    branches:
      - main

# Top-level permissions must be minimal (read-only). scorecard-action's
# publish step REJECTS a global `security-events: write` with an HTTP 400
# ("global perm is set to write") — the write perms must be scoped to the job.
# See https://github.com/ossf/scorecard-action#workflow-restrictions
permissions: read-all

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by scorecard to read GitHub Actions results.
      actions: read
      # Required for SARIF upload to the GitHub Security tab.
      security-events: write
      # Required to publish results to the OpenSSF Scorecard API.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif
