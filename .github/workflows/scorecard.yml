name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 6am UTC

# Declare default permissions as read-only (required by Scorecard's workflow validator)
permissions: read-all

jobs:
  scorecard:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write  # upload SARIF to Security tab
      id-token: write         # publish results + badge signing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
