# SPDX-License-Identifier: Apache-2.0
# Web e2e (stubbed) — offline Playwright flows against a mocked backend.
# Runs on every PR touching web/. This suite previously rotted and
# mass-failed unnoticed because nothing ran it; this job is the guard.
name: Web e2e (stubbed)

on:
  pull_request:
    branches:
      - main
    paths:
      - "web/**"

permissions:
  contents: read

jobs:
  e2e-stubbed:
    name: Playwright e2e-stubbed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      # The suite runs four projects: chromium, firefox, and two chromium
      # color-scheme variants (dark-mode / light-mode). Install chromium +
      # firefox with their OS deps.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: web

      - name: Build frontend
        run: pnpm run build
        working-directory: web

      # CI is set by GitHub Actions, so playwright.config's
      # reuseExistingServer:!CI is false — Playwright starts its own
      # `vite preview` on :5192 against the freshly built web/dist.
      - name: Run e2e-stubbed
        run: npx playwright test --config=playwright.config.ts
        working-directory: web

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
