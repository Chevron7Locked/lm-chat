name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff==0.15.5 codespell==2.4.2

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Codespell
        run: codespell server.py qr.py index.html style.css app.js

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Server imports cleanly
        run: python -c "from server import Handler, init_db; print('imports ok')"

      - name: Server starts and responds
        run: |
          LM_CHAT_AUTH=false python server.py &
          SERVER_PID=$!
          sleep 2
          # Health check (503 expected — no LM Studio in CI, but response must be valid JSON with version)
          python -c "
          import urllib.request, json
          try:
              r = urllib.request.urlopen('http://localhost:3001/api/health', timeout=5)
          except urllib.error.HTTPError as e:
              r = e
          d = json.loads(r.read())
          assert 'version' in d, f'missing version in health response: {d}'
          assert d['db'] == True, f'db not initialized: {d}'
          print(f'Health OK: version={d[\"version\"]}, db={d[\"db\"]}, lmstudio={d[\"lmstudio\"]}')
          "
          # Serves frontend and static assets
          for path in / /style.css /app.js /manifest.json /sw.js /lm-chat-logo.svg; do
            HTTP_CODE=$(python -c "import urllib.request; r=urllib.request.urlopen('http://localhost:3001${path}', timeout=5); print(r.status)")
            echo "${path}: ${HTTP_CODE}"
            [ "$HTTP_CODE" = "200" ] || exit 1
          done
          kill $SERVER_PID

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit + pip-audit
        run: pip install bandit[toml]==1.9.3 pip-audit==2.9.0

      - name: Bandit — Python security scan
        run: bandit -r server.py qr.py -f sarif -o bandit.sarif
        continue-on-error: true

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: pip-audit — dependency CVE scan
        run: pip-audit --requirement <(pip freeze) --format=json --output pip-audit.json || true

      - name: Summarise pip-audit
        run: |
          python3 -c "
          import json, sys
          data = json.load(open('pip-audit.json'))
          vulns = data.get('vulnerabilities', [])
          if vulns:
              print(f'::warning::pip-audit found {len(vulns)} vulnerable package(s)')
              for v in vulns:
                  print(f'  {v[\"name\"]}=={v[\"version\"]}: {[a[\"id\"] for a in v[\"aliases\"]]}')
          else:
              print('pip-audit: no vulnerabilities found')
          "

  dockerfile:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Hadolint — Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true

      - name: Upload Hadolint SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks — secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
