# OWASP ZAP baseline whitelist for the P15d L6 gate (PLAN R-28).
#
# Each non-blank, non-`#` line is a ZAP plugin id (the `pluginid` field in
# the ZAP JSON report) that should NOT fail the gate when raised against
# the headless containerized lm-chat at 127.0.0.1:18001.
#
# Format:
#   <pluginid>   # optional inline comment explaining why it's whitelisted
#
# Whitelisting policy (per PLAN R-28):
#   1. A plugin id may only be added here if the operator has reviewed the
#      raised finding and confirmed it is a documented false positive OR
#      a known-accepted risk tracked in docs/adr/ or PROD-READINESS-r1.
#   2. Each addition lands in the same PR as the finding it whitelists,
#      with the inline comment referencing the ADR / disposition ref.
#   3. Re-evaluate quarterly: stale entries (no longer triggered or no
#      longer accepted) get pruned.
#
# Start empty — populated as real ZAP scans surface false positives.

