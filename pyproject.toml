[tool.ruff]
target-version = "py314"
line-length = 220

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (undefined names, unused imports)
    "UP",    # pyupgrade (modernize syntax)
    "B",     # bugbear (likely bugs)
    "S",     # bandit security rules (via ruff — replaces standalone bandit)
]
ignore = [
    "E401",  # multiple imports on one line (existing style)
    "E501",  # line too long (single-file server, not fighting it)
    "E701",  # multiple statements on one line (existing style)
    "S104",  # binding to all interfaces (intentional — Docker server)
    "S110",  # try-except-pass (used for DB migration checks)
    "S113",  # request without timeout (we always set timeouts)
    "S310",  # audit urlopen schemes (all calls go to LMSTUDIO localhost)
    "S311",  # pseudo-random (we use secrets module for crypto)
    "S324",  # insecure hash (we use hmac, not raw md5/sha1)
    "S608",  # SQL injection (all dynamic queries use ? placeholders)
    "B905",  # zip strict= (dot product math, lengths always match)
]

[tool.ruff.lint.per-file-ignores]
"server.py" = ["S603", "S607"]  # subprocess calls are intentional
"tests/*" = ["S101", "S105", "S106", "S603", "S607", "E402"]  # assert, hardcoded passwords, subprocess all expected in tests

[tool.codespell]
skip = ".git*,*.min.js,*.min.css,*.svg"
ignore-words-list = "totalin,ans"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "smoke: Cross-browser smoke tests (run with --browser chromium --browser firefox --browser webkit)",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "seed_db.py",
    "seed_test_data.py",
    "highlight.min.js",
]
parallel = true
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Baseline: 2026-05-14 — server.py: 69%, qr.py: 98%, total: 72%.
#
# Earlier comment claimed 0%: that wasn't true coverage of the codebase — it was
# the sitecustomize.py subprocess-coverage hook silently failing to import
# `coverage` under Homebrew Python, so every subprocess test contributed nothing.
# tests/sitecustomize.py now compensates for the Homebrew site-packages quirk
# and the in-process fixtures in tests/conftest.py exercise the request handler
# directly.  Together they expose 72% of the application surface to tracing.
#
# Hot zones still uncovered (target for the next pass):
#   - server.py:1187-1222  — _auth_setup (no fresh-install test in suite)
#   - server.py:1502-1538  — _save_settings (per-user LM Studio API key path)
#   - server.py:2849-2904  — _chain_of_verification (CoVe E2E)
#   - server.py:3284-3360  — _refine_insights (insight refinement)
#
# fail_under is set ~3 points below the current measure to absorb test
# ordering jitter without going lower than honest coverage.  Keep this
# value in sync with the --fail-under flag in .github/workflows/ci.yml's
# "Coverage report" step — drift between the two means CI and local can
# disagree on pass/fail.
fail_under = 70
