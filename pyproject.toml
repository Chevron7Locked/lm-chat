[tool.ruff]
target-version = "py312"
line-length = 220

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (undefined names, unused imports)
    "UP",    # pyupgrade (modernize syntax)
    "B",     # bugbear (likely bugs)
    "S",     # bandit security rules (via ruff — replaces standalone bandit)
]
ignore = [
    "E401",  # multiple imports on one line (existing style)
    "E501",  # line too long (single-file server, not fighting it)
    "E701",  # multiple statements on one line (existing style)
    "S104",  # binding to all interfaces (intentional — Docker server)
    "S110",  # try-except-pass (used for DB migration checks)
    "S113",  # request without timeout (we always set timeouts)
    "S310",  # audit urlopen schemes (all calls go to LMSTUDIO localhost)
    "S311",  # pseudo-random (we use secrets module for crypto)
    "S324",  # insecure hash (we use hmac, not raw md5/sha1)
    "S608",  # SQL injection (all dynamic queries use ? placeholders)
    "B905",  # zip strict= (dot product math, lengths always match)
]

[tool.ruff.lint.per-file-ignores]
"server.py" = ["S603", "S607"]  # subprocess calls are intentional
"tests/*" = ["S101", "S105", "S106", "S603", "S607", "E402"]  # assert, hardcoded passwords, subprocess all expected in tests

[tool.codespell]
skip = ".git*,*.min.js,*.min.css,*.svg"
ignore-words-list = "totalin,ans"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "smoke: Cross-browser smoke tests (run with --browser chromium --browser firefox --browser webkit)",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "seed_db.py",
    "seed_test_data.py",
    "highlight.min.js",
]
parallel = true
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Baseline: 2026-03-17 — server.py + qr.py: 0% (tests run server.py as subprocess)
# Raise fail_under incrementally as coverage improves (requires direct import fixtures)
fail_under = 40
