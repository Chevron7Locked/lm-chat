# Alembic configuration for lm-chat v1.
# See docs/adr/012-inline-migrations.md for the policy rationale.

[alembic]
# Path to the migrations tree, relative to the location of alembic.ini.
script_location = migrations

# Drives the fallback URL when env.py cannot import lmchat.config.
# In practice env.py always wins; this value is present for `alembic` CLI
# invocations that happen before the package is installed.
sqlalchemy.url = sqlite+aiosqlite:///./lmchat.db

# Add src/ to sys.path so `import lmchat.*` works from the CLI.
prepend_sys_path = .
path_separator = os

# File-naming template for auto-generated revision files.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Revision files are rendered in UTC.
timezone = UTC

# Trim revision slug to 40 chars so filenames don't explode.
truncate_slug_length = 40

# Don't invoke env.py for every `alembic history` call -- only for actual
# migration operations.
revision_environment = false

# We don't use .pyc-only distribution of migration scripts.
sourceless = false

# File encoding for generated migration scripts.
output_encoding = utf-8


# ---------------------------------------------------------------------------
# Logging -- quiet defaults; the structlog stack handles app-level logging.
# alembic and sqlalchemy.engine emit at WARNING+ so CI is not flooded.
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
