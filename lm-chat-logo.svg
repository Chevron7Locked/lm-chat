<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- LM Chat Logo — rich copper-gold bars on transparent -->
  <!-- Stacked horizontal bars with rounded ends, varying widths, slight stagger -->
  <g transform="translate(256, 256)">
    <!-- Bar 1 (top) — medium, slight right offset -->
    <rect x="-10" y="-160" width="200" height="36" rx="18" ry="18" fill="#E8A94E"/>
    <!-- Bar 2 — long, slight left offset -->
    <rect x="-140" y="-90" width="280" height="36" rx="18" ry="18" fill="#E8A94E"/>
    <!-- Bar 3 (center) — widest, centered -->
    <rect x="-100" y="-20" width="240" height="36" rx="18" ry="18" fill="#E8A94E"/>
    <!-- Bar 4 — long, slight left offset -->
    <rect x="-150" y="50" width="270" height="36" rx="18" ry="18" fill="#E8A94E"/>
    <!-- Bar 5 (bottom) — short, slight right offset -->
    <rect x="-30" y="120" width="180" height="36" rx="18" ry="18" fill="#E8A94E"/>
  </g>
</svg>
