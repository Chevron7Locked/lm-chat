# cosmic-ray mutation testing configuration — LMChat Week-1 baseline (2026-06-08).
#
# Phase 1: run-locally only; no CI gate yet. Collect baseline mutation scores
# for the three target files before setting a floor in Phase 2.
#
# Usage:
#   make mutation-baseline            # runs all three sessions sequentially
#   make mutation-baseline TARGET=streaming_client  # single target
#
# See scripts/mutation-baseline.sh for the full execution script.
#
# cosmic-ray TOML schema: https://cosmic-ray.readthedocs.io/en/latest/configuration.html
# The [cosmic-ray] section is mandatory — cosmic-ray's loader calls
#   toml.loads(content)["cosmic-ray"]
# so every key lives under that top-level table.

# ---------------------------------------------------------------------------
# Shared defaults (overridden per-target in scripts/mutation-baseline.sh)
# ---------------------------------------------------------------------------
[cosmic-ray]
# Module path is set per-target via the shell script (--config override or
# separate toml stanzas).  The default here targets the streaming client
# as the highest-priority target.
module-path = "src/lmchat/services/lmstudio_streaming_client.py"

# 4-hour wall-clock timeout per individual test run (14400 s).
# Streaming tests involve asyncio; 30 s per mutation is a generous ceiling.
timeout = 30.0

# Modules excluded from mutation (test files, type stubs, __init__ files).
excluded-modules = []

# Test command: runs only the fast unit + service suites (not stress/e2e).
# The -m 'not stress_invariant' guard matches pyproject.toml's default.
test-command = "uv run pytest tests/services tests/lmstudio tests/routes tests/contracts -x -q -m 'not stress_invariant' --timeout=25"

[cosmic-ray.distributor]
# Local sequential distributor — no external worker farm needed for Phase 1.
name = "local"


# ---------------------------------------------------------------------------
# Per-target override configs (used by scripts/mutation-baseline.sh).
# These are separate TOML files generated by the script from this template.
# The comments below document what the script injects.
# ---------------------------------------------------------------------------
#
# Target A — lmstudio_streaming_client.py
#   module-path = "src/lmchat/services/lmstudio_streaming_client.py"
#   session-file = "target/mutation/streaming_client.sqlite"
#
# Target B — routes/chats.py (scoped to _sub_session_sse)
#   module-path = "src/lmchat/routes/chats.py"
#   session-file = "target/mutation/chats.sqlite"
#   # cosmic-ray does not support function-level scoping in v8; the
#   # full file is mutated.  The test command filters to sub-session tests
#   # to keep the run manageable.
#
# Target C — lmstudio/native.py
#   module-path = "src/lmchat/lmstudio/native.py"
#   session-file = "target/mutation/native.sqlite"
